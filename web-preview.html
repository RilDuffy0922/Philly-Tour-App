<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Philly Tour App - Schuylkill River Stationary Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .device-container {
      width: 100%;
      max-width: 440px;
      height: 860px;
      max-height: 94vh;
      background: #ffffff;
      border-radius: 40px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.6), 0 0 0 10px #1e293b;
    }
    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    /* Top Header Bar */
    .top-bar {
      position: absolute;
      top: 18px;
      left: 14px;
      right: 14px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 12px 16px;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .top-bar h1 {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      color: #2563eb;
      margin-top: 2px;
    }
    .lock-btn {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1d4ed8;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    .lock-btn:hover { background: #dbeafe; }

    /* Bottom Carousel */
    .bottom-carousel-container {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 14px 0 18px 0;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
    }
    .carousel-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
      margin-bottom: 8px;
      padding: 0 16px;
    }
    .stop-scroller {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 16px 8px 16px;
      scrollbar-width: none;
    }
    .stop-scroller::-webkit-scrollbar { display: none; }
    .stop-card-item {
      flex: 0 0 200px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .stop-card-item.active {
      border-color: #2563eb;
      background: #eff6ff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
    }
    .stop-card-item h3 {
      font-size: 13px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stop-card-item p {
      font-size: 11px;
      color: #64748b;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.3;
    }

    /* Modal Sheet */
    .sheet-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      z-index: 1500;
      display: none;
      align-items: flex-end;
    }
    .sheet-overlay.open { display: flex; }
    .sheet-content {
      background: #ffffff;
      width: 100%;
      max-height: 80%;
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      padding: 16px 20px 24px 20px;
      overflow-y: auto;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.2);
      animation: slideUp 0.28s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .drag-indicator {
      width: 36px;
      height: 4px;
      background: #cbd5e1;
      border-radius: 2px;
      margin: 0 auto 12px auto;
    }
    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .sheet-header h2 { font-size: 18px; font-weight: 700; color: #0f172a; }
    .sheet-sub {
      font-size: 11px;
      color: #64748b;
      margin-top: 2px;
      display: flex;
      gap: 12px;
    }
    .close-btn {
      background: #f1f5f9;
      border: none;
      font-size: 18px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #475569;
    }
    .narration-box {
      background: #f8fafc;
      border-radius: 14px;
      padding: 14px;
      margin-top: 14px;
      border: 1px solid #e2e8f0;
    }
    .narration-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .narration-header h4 { font-size: 13px; font-weight: 700; color: #334155; }
    .audio-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .audio-btn.playing { background: #ea580c; }
    .narration-text {
      font-size: 13px;
      line-height: 1.5;
      color: #334155;
    }
    .trivia-box {
      margin-top: 16px;
      background: #f1f5f9;
      border-radius: 14px;
      padding: 14px;
    }
    .trivia-title {
      font-size: 13px;
      font-weight: 700;
      color: #4338ca;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .trivia-question {
      font-size: 13px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 10px;
    }
    .trivia-option {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      margin-bottom: 6px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s;
    }
    .trivia-option:hover { border-color: #94a3b8; }
    .trivia-option.correct {
      background: #dcfce7;
      border-color: #22c55e;
      color: #15803d;
      font-weight: 600;
    }
    .trivia-option.wrong {
      background: #fee2e2;
      border-color: #ef4444;
      color: #b91c1c;
    }
  </style>
</head>
<body>

  <div class="device-container">
    <!-- Top Navigation Bar -->
    <div class="top-bar">
      <div>
        <h1>Philly Tour App</h1>
        <div class="badge" id="lock-status-badge">
          <span>🔒</span> Stationary Schuylkill River View
        </div>
      </div>
      <button class="lock-btn" id="lock-btn" title="Toggle Lock / Pan">
        🔒
      </button>
    </div>

    <!-- Map Canvas -->
    <div id="map"></div>

    <!-- Bottom Carousel -->
    <div class="bottom-carousel-container">
      <div class="carousel-title">Schuylkill River Stops</div>
      <div class="stop-scroller" id="stop-scroller"></div>
    </div>

    <!-- Stop Details & Trivia Modal Sheet -->
    <div class="sheet-overlay" id="sheet-overlay">
      <div class="sheet-content">
        <div class="drag-indicator"></div>
        <div class="sheet-header">
          <div>
            <h2 id="sheet-title">Stop Title</h2>
            <div class="sheet-sub">
              <span id="sheet-coords">39.9656, -75.1810</span>
              <span id="sheet-radius">Geofence: 80m</span>
            </div>
          </div>
          <button class="close-btn" id="close-btn">&times;</button>
        </div>

        <div class="narration-box">
          <div class="narration-header">
            <h4>Audio Narration</h4>
            <button class="audio-btn" id="play-audio-btn">
              <span>▶</span> Play Narration
            </button>
          </div>
          <p class="narration-text" id="sheet-narration">Narration text goes here.</p>
        </div>

        <div class="trivia-box">
          <div class="trivia-title">
            <span>River Trivia</span>
            <span id="trivia-result-badge"></span>
          </div>
          <p class="trivia-question" id="sheet-question">Question text?</p>
          <div id="trivia-options-container"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Tour Stops Data (matches Stop.swift & StopData.swift)
    const STOPS = [
      {
        id: "art-museum",
        name: "Philadelphia Museum of Art",
        lat: 39.9656,
        lng: -75.1810,
        radius: 80,
        narration: "Welcome to the Philadelphia Museum of Art, perched high above the Schuylkill River. Famous worldwide for its iconic 72 stone steps immortalized by Rocky Balboa, it houses world-class collections spanning over 2,000 years of creativity.",
        trivia: {
          question: "How many stone steps lead up to the Philadelphia Museum of Art's east entrance?",
          options: ["54", "72", "88", "100"],
          correctIndex: 1
        }
      },
      {
        id: "water-works",
        name: "Fairmount Water Works",
        lat: 39.9678,
        lng: -75.1831,
        radius: 65,
        narration: "Directly behind the Art Museum lies the Fairmount Water Works. Built between 1812 and 1815, this was America's first municipal water system to harness the power of the Schuylkill River with innovative paddlewheels and turbines.",
        trivia: {
          question: "What river powered the Fairmount Water Works system?",
          options: ["Delaware River", "Schuylkill River", "Susquehanna River", "Lehigh River"],
          correctIndex: 1
        }
      },
      {
        id: "boathouse-row",
        name: "Boathouse Row",
        lat: 39.9702,
        lng: -75.1887,
        radius: 75,
        narration: "Looking upriver, you see the iconic Boathouse Row along Kelly Drive. Dating back to the 19th century, these 15 historic boathouses line the Schuylkill and light up the riverbank at night, home to generations of champion collegiate and Olympic rowers.",
        trivia: {
          question: "What sport is famously practiced from Boathouse Row on the Schuylkill?",
          options: ["Kayaking polo", "Rowing / Crew", "Water skiing", "Sailing"],
          correctIndex: 1
        }
      },
      {
        id: "boardwalk",
        name: "Schuylkill Banks Boardwalk",
        lat: 39.9482,
        lng: -75.1804,
        radius: 70,
        narration: "Heading south down the river, the Schuylkill Banks Boardwalk is a concrete pathway floating directly 50 feet out over the Schuylkill River. It connects Locust Street to the South Street Bridge with stunning skyline views.",
        trivia: {
          question: "How far out into the Schuylkill River does the Schuylkill Boardwalk extend?",
          options: ["10 feet", "50 feet", "120 feet", "200 feet"],
          correctIndex: 1
        }
      },
      {
        id: "30th-st",
        name: "30th Street River Overlook",
        lat: 39.9558,
        lng: -75.1820,
        radius: 60,
        narration: "Positioned directly between University City and Center City, this bridge overlook crosses the Schuylkill right next to Amtrak's historic 30th Street Station, built in 1933 with towering 95-foot Corinthian columns.",
        trivia: {
          question: "Which major rail hub sits just west of the Schuylkill River at Market Street?",
          options: ["Suburban Station", "Jefferson Station", "30th Street Station", "North Philadelphia Station"],
          correctIndex: 2
        }
      },
      {
        id: "river-park",
        name: "Schuylkill River Park",
        lat: 39.9470,
        lng: -75.1818,
        radius: 60,
        narration: "Schuylkill River Park offers lush green space, sports courts, and a community garden right along the riverbanks, serving as a hub for cyclists and runners along the Schuylkill River Trail.",
        trivia: {
          question: "Which popular trail runs along this park alongside the river?",
          options: ["Appalachian Trail", "Schuylkill River Trail", "Wissahickon Gorge Trail", "Delaware Canal Path"],
          correctIndex: 1
        }
      }
    ];

    // Schuylkill River Center Coordinates
    const SCHUYLKILL_CENTER = [39.9605, -75.1830];
    let isStationary = true;
    let activeStop = null;
    let markersMap = {};

    // Initialize Map with locked / stationary controls
    const map = L.map('map', {
      center: SCHUYLKILL_CENTER,
      zoom: 14,
      zoomControl: false,
      dragging: false,
      touchZoom: false,
      scrollWheelZoom: false,
      doubleClickZoom: false,
      boxZoom: false,
      keyboard: false
    });

    // CartoDB Positron / OSM tiles
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '&copy; CartoDB &copy; OpenStreetMap'
    }).addTo(map);

    // Render Markers & Geofences
    STOPS.forEach(stop => {
      // Geofence Circle
      L.circle([stop.lat, stop.lng], {
        radius: stop.radius,
        color: '#2563eb',
        weight: 1.5,
        fillColor: '#3b82f6',
        fillOpacity: 0.15
      }).addTo(map);

      // Marker
      const customIcon = L.divIcon({
        className: 'custom-pin',
        html: `<div style="background:#2563eb; width:26px; height:26px; border-radius:50%; border:3px solid white; box-shadow:0 3px 8px rgba(0,0,0,0.3); display:flex; align-items:center; justify-content:center; color:white; font-size:12px;">📍</div>`,
        iconSize: [26, 26],
        iconAnchor: [13, 13]
      });

      const marker = L.marker([stop.lat, stop.lng], { icon: customIcon }).addTo(map);
      marker.on('click', () => openStop(stop));
      markersMap[stop.id] = marker;
    });

    // Populate Carousel
    const scroller = document.getElementById('stop-scroller');
    STOPS.forEach(stop => {
      const card = document.createElement('div');
      card.className = 'stop-card-item';
      card.id = `card-${stop.id}`;
      card.innerHTML = `
        <h3>${stop.name}</h3>
        <p>${stop.narration}</p>
      `;
      card.onclick = () => openStop(stop);
      scroller.appendChild(card);
    });

    // Toggle Stationary Mode
    const lockBtn = document.getElementById('lock-btn');
    const badge = document.getElementById('lock-status-badge');
    lockBtn.onclick = () => {
      isStationary = !isStationary;
      if (isStationary) {
        map.dragging.disable();
        map.touchZoom.disable();
        map.scrollWheelZoom.disable();
        map.setView(SCHUYLKILL_CENTER, 14);
        lockBtn.innerText = '🔒';
        badge.innerHTML = '<span>🔒</span> Stationary Schuylkill River View';
        badge.style.color = '#2563eb';
      } else {
        map.dragging.enable();
        map.touchZoom.enable();
        map.scrollWheelZoom.enable();
        lockBtn.innerText = '✋';
        badge.innerHTML = '<span>✋</span> Map Pan/Zoom Unlocked';
        badge.style.color = '#ea580c';
      }
    };

    // Open Stop Modal Sheet
    const sheet = document.getElementById('sheet-overlay');
    function openStop(stop) {
      activeStop = stop;
      document.querySelectorAll('.stop-card-item').forEach(c => c.classList.remove('active'));
      document.getElementById(`card-${stop.id}`).classList.add('active');

      document.getElementById('sheet-title').innerText = stop.name;
      document.getElementById('sheet-coords').innerText = `${stop.lat.toFixed(4)}, ${stop.lng.toFixed(4)}`;
      document.getElementById('sheet-radius').innerText = `Geofence: ${stop.radius}m`;
      document.getElementById('sheet-narration').innerText = stop.narration;

      // Reset Audio
      window.speechSynthesis.cancel();
      document.getElementById('play-audio-btn').innerText = '▶ Play Narration';
      document.getElementById('play-audio-btn').classList.remove('playing');

      // Setup Trivia
      document.getElementById('sheet-question').innerText = stop.trivia.question;
      document.getElementById('trivia-result-badge').innerText = '';
      const optsContainer = document.getElementById('trivia-options-container');
      optsContainer.innerHTML = '';

      stop.trivia.options.forEach((opt, idx) => {
        const btn = document.createElement('div');
        btn.className = 'trivia-option';
        btn.innerHTML = `<span>${opt}</span><span class="icon"></span>`;
        btn.onclick = () => {
          optsContainer.querySelectorAll('.trivia-option').forEach(b => b.onclick = null);
          if (idx === stop.trivia.correctIndex) {
            btn.classList.add('correct');
            btn.querySelector('.icon').innerText = '✓';
            document.getElementById('trivia-result-badge').innerHTML = '<span style="color:#16a34a; font-weight:700;">✓ Correct!</span>';
          } else {
            btn.classList.add('wrong');
            btn.querySelector('.icon').innerText = '✕';
            const correctBtn = optsContainer.children[stop.trivia.correctIndex];
            correctBtn.classList.add('correct');
            correctBtn.querySelector('.icon').innerText = '✓';
            document.getElementById('trivia-result-badge').innerHTML = '<span style="color:#dc2626; font-weight:700;">✕ Try Again</span>';
          }
        };
        optsContainer.appendChild(btn);
      });

      sheet.classList.add('open');
    }

    // Close Modal
    document.getElementById('close-btn').onclick = () => {
      sheet.classList.remove('open');
      window.speechSynthesis.cancel();
      document.querySelectorAll('.stop-card-item').forEach(c => c.classList.remove('active'));
    };

    // Narration Speech Synthesis
    const audioBtn = document.getElementById('play-audio-btn');
    audioBtn.onclick = () => {
      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
        audioBtn.innerText = '▶ Play Narration';
        audioBtn.classList.remove('playing');
      } else if (activeStop) {
        const utterance = new SpeechSynthesisUtterance(activeStop.narration);
        utterance.rate = 0.95;
        utterance.onend = () => {
          audioBtn.innerText = '▶ Play Narration';
          audioBtn.classList.remove('playing');
        };
        window.speechSynthesis.speak(utterance);
        audioBtn.innerText = '⏸ Pause Audio';
        audioBtn.classList.add('playing');
      }
    };
  </script>
</body>
</html>
